name: Релизные Docker-образы

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Релизный тег, например v1.2.3
        required: true
        type: string

concurrency:
  group: release-images-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Проверка правил CI и релиза
        run: node --test scripts/ci/*.test.mjs
      - name: Определить точный коммит релизного тега
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_EVENT_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
        run: node scripts/ci/release.mjs

  verify:
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      full: true
    permissions:
      contents: read

  build-and-push:
    needs: [release, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ needs.release.outputs.image_tag }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      STAGE_API_URL: https://stage.easy-tasktraker.ru/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Проверить коммит сборки
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Определить имена образов
        id: images
        shell: bash
        run: |
          image_namespace="${IMAGE_NAMESPACE,,}"
          echo "api=$REGISTRY/$image_namespace/tracker-api:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "web=$REGISTRY/$image_namespace/tracker-web:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка и публикация API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}
          cache-from: type=gha,scope=tracker-api
          cache-to: type=gha,mode=max,scope=tracker-api
      - name: Сборка и публикация web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.web }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.STAGE_API_URL }}
          cache-from: type=gha,scope=tracker-web
          cache-to: type=gha,mode=max,scope=tracker-web
      - name: Итог публикации
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
        run: |
          {
            echo "## Релизные образы"
            echo "- Релиз: $RELEASE_TAG"
            echo "- Проверенный коммит: $RELEASE_SHA"
            echo "- API: $API_IMAGE"
            echo "- Web: $WEB_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
